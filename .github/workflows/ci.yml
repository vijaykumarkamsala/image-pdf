name: POC checks

# Proves POC-001 acceptance criterion 1: "A clean checkout can install
# dependencies using documented commands." A local pass on the author's machine
# is not evidence; a clean runner is.
#
# No remote is configured yet, so this workflow is dormant until one exists.

on:
  push:
    branches: ["main", "poc/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, and both platform families, because
        # byte-determinism claims must hold across line endings and filesystems.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Exactly the command documented in README.md.
      - name: Install all workspaces
        run: >
          python -m pip install
          -c requirements-dev.lock.txt
          -r requirements-dev.txt
          -e packages/contracts
          -e packages/processors
          -e services/benchmark-runner

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node workspaces
        run: npm ci

      # libvips is packaged on Linux; the Windows job exercises the
      # engine-unavailable path instead, which is itself worth testing.
      - name: Install libvips (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvips

      - name: Run every gate
        run: python tools/check.py

  scope-guard:
    name: Scope guard — no model, weight or provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >
          python -m pip install
          -c requirements-dev.lock.txt
          -r requirements-dev.txt
          -e packages/contracts
          -e packages/processors
          -e services/benchmark-runner
      - name: Assert POC scope boundary and monorepo layering
        run: >
          python -m pytest tests/test_scope_and_artifacts.py tests/test_workspaces.py
          -q --no-cov
