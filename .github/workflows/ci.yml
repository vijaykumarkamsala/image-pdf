name: Product gates

on:
  push:
    branches: ["main", "poc/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_linux_baselines:
        description: Regenerate canonical Linux image and browser baselines for review
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-linux:
    name: Canonical Linux production evidence
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: ipw_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipw_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned production-derived evidence image
        run: >-
          docker build
          --file services/processing-worker/Dockerfile
          --target canonical-ci
          --tag ipw-canonical-linux:${{ github.sha }}
          .

      - name: Regenerate Linux canonical baselines
        if: github.event_name == 'workflow_dispatch' && inputs.update_linux_baselines
        run: |
          sudo chown -R 10001:10001 \
            data/goldens \
            data/fixtures/images/recovery2e \
            apps/web/tests/__screenshots__
          docker run --rm --network host --shm-size=2gb \
            -e IPW_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/ipw_ci \
            -v "${{ github.workspace }}/data/goldens:/opt/ipw/data/goldens" \
            -v "${{ github.workspace }}/data/fixtures/images/recovery2e:/opt/ipw/data/fixtures/images/recovery2e" \
            -v "${{ github.workspace }}/apps/web/tests/__screenshots__:/opt/ipw/apps/web/tests/__screenshots__" \
            ipw-canonical-linux:${{ github.sha }} \
            sh -lc "python tools/make_recovery_2e_fixtures.py && \
                    python tools/make_goldens.py && \
                    npm run test:e2e --workspace ipw-web --silent -- --update-snapshots"
          sudo chown -R "$(id -u):$(id -g)" \
            data/goldens \
            data/fixtures/images/recovery2e \
            apps/web/tests/__screenshots__

      - name: Run every authoritative gate
        if: ${{ ! (github.event_name == 'workflow_dispatch' && inputs.update_linux_baselines) }}
        run: >-
          docker run --rm --network host --shm-size=2gb
          -e IPW_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/ipw_ci
          ipw-canonical-linux:${{ github.sha }}

      - name: Verify regenerated authoritative gates
        if: github.event_name == 'workflow_dispatch' && inputs.update_linux_baselines
        run: |
          sudo chown -R 10001:10001 \
            data/goldens \
            data/fixtures/images/recovery2e \
            apps/web/tests/__screenshots__
          docker run --rm --network host --shm-size=2gb \
            -e IPW_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/ipw_ci \
            -v "${{ github.workspace }}/data/goldens:/opt/ipw/data/goldens:ro" \
            -v "${{ github.workspace }}/data/fixtures/images/recovery2e:/opt/ipw/data/fixtures/images/recovery2e:ro" \
            -v "${{ github.workspace }}/apps/web/tests/__screenshots__:/opt/ipw/apps/web/tests/__screenshots__:ro" \
            ipw-canonical-linux:${{ github.sha }}
          sudo chown -R "$(id -u):$(id -g)" \
            data/goldens \
            data/fixtures/images/recovery2e \
            apps/web/tests/__screenshots__

      - name: Upload Linux baselines for visual review
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_linux_baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-linux-baselines-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            data/goldens
            data/fixtures/images/recovery2e
            apps/web/tests/__screenshots__

  windows-compatibility:
    name: Windows development compatibility
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup-python-workspaces
        with:
          python-version: "3.14.5"

      - name: Install pinned Windows libvips
        run: python tools/install_libvips.py

      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.10.0"

      - name: Install exact Node workspaces and Chromium
        run: |
          npm.cmd ci
          npx.cmd playwright install chromium

      - name: Format, lint and type compatibility
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy

      - name: Python behavior and decoded-image compatibility
        run: |
          python -m pytest -m "not canonical_linux" --no-cov
          python tools/make_recovery_2e_fixtures.py --compatibility
          python tools/make_goldens.py --compatibility

      - name: TypeScript and browser behavior compatibility
        run: |
          npm.cmd run typecheck --silent
          npm.cmd run test --silent
          npm.cmd run test:e2e --workspace ipw-web --silent -- --grep-invert "@visual|@studio-visual"
