name: POC checks

# Proves POC-001 acceptance criterion 1: "A clean checkout can install
# dependencies using documented commands." A local pass on the author's machine
# is not evidence; a clean runner is.
#
# Every workspace is installed, not only the three the POC started with: the
# tests import ipw.pdf, ipw.vector and ipw.workspace_api, and a runner that
# installs less than the suite imports fails on a collection error rather
# than on anything real.

on:
  push:
    branches: ["main", "poc/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, and both platform families, because
        # byte-determinism claims must hold across line endings and filesystems.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Exactly the command documented in README.md.
      - name: Install all workspaces
        run: >
          python -m pip install
          -c requirements-dev.lock.txt
          -r requirements-dev.txt
          -e packages/contracts
          -e packages/processors
          -e packages/metrics
          -e packages/pdf
          -e packages/vector
          -e services/benchmark-runner
          -e services/workspace-api

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Node workspaces
        run: npm ci

      # libvips is packaged on Linux; the Windows job exercises the
      # engine-unavailable path instead, which is itself worth testing.
      - name: Install libvips (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvips

      # OCR is a shipped feature - it is what makes a scan searchable - and
      # without the binary every test that exercises it skips. A suite that
      # skips twenty tests reports success for a feature it never ran, which is
      # worse than reporting nothing. Installed on both platforms because the
      # coordinate handling differs between them and the inverted-page bug this
      # suite checks for is exactly the kind that appears on one and not the
      # other.
      #
      # The pinned 5.4.0 build in the licence register stays the production
      # artifact; the distribution package here is for exercising the code, and
      # the assertions are structural - word counts, box geometry, confidence -
      # rather than exact strings, so a minor version difference does not flake.
      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tesseract-ocr

      # choco puts it at C:/Program Files/Tesseract-OCR, which is already in the
      # fallback list `locate()` searches when a fresh install has not reached
      # the running shell's PATH.
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --no-progress -y

      - name: Run every gate
        # A runner has no model weights and is forbidden from fetching any, so
        # the inference code cannot execute here. .coveragerc-ci omits exactly
        # those modules and nothing else, holding this environment to the same
        # standard for the code it can actually run. See the file for why the
        # alternatives - lowering the threshold, or `pragma: no cover` - are both
        # worse.
        env:
          COVERAGE_RCFILE: .coveragerc-ci
        run: python tools/check.py

  scope-guard:
    name: Scope guard — no model, weight or provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >
          python -m pip install
          -c requirements-dev.lock.txt
          -r requirements-dev.txt
          -e packages/contracts
          -e packages/processors
          -e packages/metrics
          -e packages/pdf
          -e packages/vector
          -e services/benchmark-runner
          -e services/workspace-api
      - name: Assert POC scope boundary and monorepo layering
        run: >
          python -m pytest tests/test_scope_and_artifacts.py tests/test_workspaces.py
          -q --no-cov
