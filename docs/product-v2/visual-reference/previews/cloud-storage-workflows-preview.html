.form-check-input {

          &lt;div class=&quot;cs-lineage-item&quot;&gt;&lt;span class=&quot;cs-lineage-icon&quot;&gt;&lt;i data-lucide=&quot;package-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;cs-lineage-title&quot;&gt;Export results&lt;/span&gt;&lt;span class=&quot;cs-lineage-meta&quot;&gt;Saved back only when explicitly requested&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cs-inspector-section&quot;&gt;&lt;div class=&quot;cs-inspector-title&quot;&gt;Safe defaults&lt;/div&gt;&lt;div class=&quot;cs-fact&quot;&gt;&lt;i data-lucide=&quot;file-plus-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Import as new source version&lt;/strong&gt;&lt;small&gt;Never replace active work automatically&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cs-fact&quot;&gt;&lt;i data-lucide=&quot;scan-search&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Conflict check before write&lt;/strong&gt;&lt;small&gt;External changes block silent overwrite&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cs-fact&quot;&gt;&lt;i data-lucide=&quot;history&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Complete provenance&lt;/strong&gt;&lt;small&gt;Provider, version, user and time recorded&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;cs-inspector-section&quot;&gt;&lt;div class=&quot;cs-inspector-title&quot;&gt;Sharing boundary&lt;/div&gt;&lt;div class=&quot;cs-provider-rule&quot;&gt;&lt;strong&gt;Provider access stays separate.&lt;/strong&gt;&lt;br&gt;Google Drive, SharePoint and Dropbox sharing never silently changes application project access—and application invites never alter provider permissions.&lt;/div&gt;&lt;/div&gt;
      &lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;cs-toast&quot; id=&quot;cs-toast&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;
    &lt;section class=&quot;cs-dialog&quot; id=&quot;cs-dialog&quot; aria-label=&quot;Disconnect Google Drive&quot; hidden&gt;
      &lt;h3&gt;Disconnect Google Drive?&lt;/h3&gt;
      &lt;p&gt;The connection will stop syncing. Nothing in Google Drive will be deleted.&lt;/p&gt;
      &lt;div class=&quot;cs-dialog-summary&quot;&gt;&lt;strong&gt;After disconnection&lt;/strong&gt;&lt;br&gt;• Existing app copies remain available under project retention.&lt;br&gt;• External source links become unavailable until reconnected.&lt;br&gt;• Future updates and save-back stop.&lt;/div&gt;
      &lt;div class=&quot;cs-dialog-actions&quot;&gt;&lt;button class=&quot;cs-button&quot; id=&quot;cs-dialog-cancel&quot; type=&quot;button&quot;&gt;Keep connected&lt;/button&gt;&lt;button class=&quot;cs-primary&quot; id=&quot;cs-dialog-confirm&quot; type=&quot;button&quot;&gt;Disconnect safely&lt;/button&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;footer class=&quot;cs-bottom&quot;&gt;&lt;span&gt;External originals protected&lt;/span&gt;&lt;span&gt;Least privilege&lt;/span&gt;&lt;span&gt;Version-aware import&lt;/span&gt;&lt;span class=&quot;cs-bottom-right&quot;&gt;&lt;span&gt;Conflict-safe writes&lt;/span&gt;&lt;span&gt;Separate sharing boundaries&lt;/span&gt;&lt;/span&gt;&lt;/footer&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;connected-storage-workflows&#x27;);
      const tabs = [...root.querySelectorAll(&#x27;.cs-tab&#x27;)];
      const panels = [...root.querySelectorAll(&#x27;[data-content]&#x27;)];
      const showPanel = (name) =&gt; {
        tabs.forEach((tab) =&gt; tab.setAttribute(&#x27;aria-selected&#x27;, String(tab.dataset.panel === name)));
        panels.forEach((panel) =&gt; { panel.hidden = panel.dataset.content !== name; });
      };
      tabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; showPanel(tab.dataset.panel)));
      root.querySelector(&#x27;#cs-save-header&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showPanel(&#x27;save&#x27;));

      const providerData = {
        drive: [&#x27;Google Drive&#x27;, &#x27;Personal connection · Access limited to Design Sources&#x27;],
        sharepoint: [&#x27;SharePoint&#x27;, &#x27;Workspace connection · Access limited to Production Library&#x27;],
        dropbox: [&#x27;Dropbox&#x27;, &#x27;Personal connection · Access limited to Client files&#x27;]
      };
      const providers = [...root.querySelectorAll(&#x27;.cs-provider&#x27;)];
      providers.forEach((provider) =&gt; provider.addEventListener(&#x27;click&#x27;, () =&gt; {
        providers.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === provider)));
        const [heading, subtitle] = providerData[provider.dataset.provider];
        root.querySelector(&#x27;#cs-provider-heading&#x27;).textContent = heading;
        root.querySelector(&#x27;#cs-provider-subtitle&#x27;).textContent = subtitle;
      }));

      const toast = root.querySelector(&#x27;#cs-toast&#x27;);
      let toastTimer;
      const announce = (message) =&gt; {
        clearTimeout(toastTimer); toast.textContent = message; toast.hidden = false;
        toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 2600);
      };
      root.querySelector(&#x27;#cs-compare-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; announce(&#x27;Detail comparison opened: changed regions are highlighted.&#x27;));
      root.querySelector(&#x27;#cs-update-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const selected = root.querySelector(&#x27;input[name=&quot;update-action&quot;]:checked&#x27;).value;
        const remembered = root.querySelector(&#x27;#cs-remember-rule&#x27;).checked ? &#x27; Rule saved for this source.&#x27; : &#x27;&#x27;;
        const messages = { review: &#x27;Source version v5 created. Current artboards remain on v4.&#x27;, keep: &#x27;Update dismissed. Current source remains v4.&#x27;, fork: &#x27;Independent source copy created. External following stopped.&#x27; };
        announce(messages[selected] + remembered);
      });

      const saveWarning = root.querySelector(&#x27;#cs-save-warning&#x27;);
      const saveAction = root.querySelector(&#x27;#cs-save-action&#x27;);
      root.querySelectorAll(&#x27;input[name=&quot;save-mode&quot;]&#x27;).forEach((radio) =&gt; radio.addEventListener(&#x27;change&#x27;, () =&gt; {
        const mode = root.querySelector(&#x27;input[name=&quot;save-mode&quot;]:checked&#x27;).value;
        if (mode === &#x27;new&#x27;) { saveWarning.innerHTML = &#x27;&lt;strong&gt;No overwrite risk.&lt;/strong&gt; A new file will be created and linked to this export result.&#x27;; saveAction.innerHTML = &#x27;&lt;i data-lucide=&quot;cloud-upload&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Save new file&#x27;; }
        if (mode === &#x27;provider-version&#x27;) { saveWarning.innerHTML = &#x27;&lt;strong&gt;Provider version check required.&lt;/strong&gt; The app will verify provider versioning and permissions before writing.&#x27;; saveAction.innerHTML = &#x27;&lt;i data-lucide=&quot;history&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Add provider version&#x27;; }
        if (mode === &#x27;replace&#x27;) { saveWarning.innerHTML = &#x27;&lt;strong&gt;Protected action.&lt;/strong&gt; A fresh conflict check and explicit replacement confirmation are required.&#x27;; saveAction.innerHTML = &#x27;&lt;i data-lucide=&quot;shield-alert&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Review replacement&#x27;; }
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }));
      saveAction.addEventListener(&#x27;click&#x27;, () =&gt; announce(&#x27;Save-back preflight complete. No external change detected.&#x27;));

      const dialog = root.querySelector(&#x27;#cs-dialog&#x27;);
      root.querySelector(&#x27;#cs-disconnect&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { dialog.hidden = false; });
      root.querySelector(&#x27;#cs-dialog-cancel&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { dialog.hidden = true; });
      root.querySelector(&#x27;#cs-dialog-confirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { dialog.hidden = true; announce(&#x27;Connection safely disconnected. External files were not changed.&#x27;); });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;

(() =&gt; {

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
