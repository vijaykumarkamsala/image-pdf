.form-check-input {

    (() =&gt; {
      const root = document.getElementById(&#x27;collaboration-locks-comments&#x27;);
      const tabs = [...root.querySelectorAll(&#x27;.cl-panel-tab&#x27;)];
      const panels = [...root.querySelectorAll(&#x27;[data-content]&#x27;)];
      tabs.forEach((tab) =&gt; tab.addEventListener(&#x27;click&#x27;, () =&gt; {
        tabs.forEach((item) =&gt; item.setAttribute(&#x27;aria-selected&#x27;, String(item === tab)));
        panels.forEach((panel) =&gt; { panel.hidden = panel.dataset.content !== tab.dataset.panel; });
      }));

      const fileButtons = [...root.querySelectorAll(&#x27;.cl-project-file&#x27;)];
      const canvas = root.querySelector(&#x27;#cl-canvas&#x27;);
      const headerLock = root.querySelector(&#x27;#cl-header-lock&#x27;);
      const viewLabel = root.querySelector(&#x27;#cl-view-label&#x27;);
      const viewMeta = root.querySelector(&#x27;#cl-view-meta&#x27;);
      const canvasStatus = root.querySelector(&#x27;#cl-canvas-status&#x27;);
      fileButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        fileButtons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        const state = button.dataset.fileState;
        canvas.classList.toggle(&#x27;is-readonly&#x27;, state === &#x27;other&#x27;);
        if (state === &#x27;mine&#x27;) {
          headerLock.innerHTML = &#x27;&lt;i data-lucide=&quot;pen-line&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;You hold the editing lock&lt;/span&gt;&#x27;;
          viewLabel.textContent = &#x27;Editing with comments visible&#x27;; viewMeta.textContent = &#x27;Asha and Ravi are viewing this version&#x27;; canvasStatus.textContent = &#x27;Autosaved · Lock renewed · v12&#x27;;
        } else if (state === &#x27;other&#x27;) {
          headerLock.innerHTML = &#x27;&lt;i data-lucide=&quot;eye&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;View-only · Asha editing&lt;/span&gt;&#x27;;
          viewLabel.textContent = &#x27;Viewing with comments visible&#x27;; viewMeta.textContent = &#x27;Asha holds the editing lock&#x27;; canvasStatus.textContent = &#x27;View-only · Comments and history available&#x27;;
        } else {
          headerLock.innerHTML = &#x27;&lt;i data-lucide=&quot;circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Available to edit&lt;/span&gt;&#x27;;
          viewLabel.textContent = &#x27;File available&#x27;; viewMeta.textContent = &#x27;Open it to acquire a short editing lease&#x27;; canvasStatus.textContent = &#x27;No editor · Safe to open&#x27;;
        }
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }));

      root.querySelectorAll(&#x27;.cl-resolve&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const comment = button.closest(&#x27;.cl-comment&#x27;);
        comment.querySelector(&#x27;.cl-comment-state&#x27;).textContent = &#x27;Resolved&#x27;;
        button.textContent = &#x27;Reopen&#x27;;
      }));

      const modeButtons = [...root.querySelectorAll(&#x27;.cl-comment-mode button&#x27;)];
      modeButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        modeButtons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        const clean = button.textContent.includes(&#x27;Clean&#x27;);
        root.querySelectorAll(&#x27;.cl-pin, .cl-region&#x27;).forEach((item) =&gt; { item.style.display = clean ? &#x27;none&#x27; : &#x27;&#x27;; });
      }));

      const dialog = root.querySelector(&#x27;#cl-takeover-dialog&#x27;);
      root.querySelector(&#x27;#cl-takeover-open&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { dialog.hidden = false; });
      root.querySelector(&#x27;#cl-takeover-cancel&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { dialog.hidden = true; });
      root.querySelector(&#x27;#cl-takeover-confirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        dialog.hidden = true;
        root.querySelector(&#x27;#cl-current-lock&#x27;).classList.remove(&#x27;is-other&#x27;);
        root.querySelector(&#x27;#cl-current-lock&#x27;).innerHTML = &#x27;&lt;strong&gt;Takeover completed safely.&lt;/strong&gt;&lt;br&gt;Asha’s work was autosaved; you now hold the editing lock and the event was audited.&#x27;;
      });
    })();
  &lt;/script&gt;
