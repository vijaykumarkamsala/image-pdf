[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipw-jobs"
version = "0.1.0"
description = "Production durable-job boundary contracts and protocols."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "ipw-contracts==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ipw*"]
namespaces = true

[tool.setuptools.package-data]
"ipw.jobs" = ["py.typed"]
