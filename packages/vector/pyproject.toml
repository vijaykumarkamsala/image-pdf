[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipw-vector"
version = "0.1.0"
description = "Raster-to-vector tracing for the Image & PDF Workspace."
requires-python = ">=3.11"
license = "MIT"

# No tracing library is a dependency. Pillow decodes the image and reduces the
# palette; numpy holds the masks. Everything between - boundary following, curve
# fitting, SVG and PDF emission - is here, because the alternatives are
# GPL-licensed (potrace, autotrace) and would decide the licence of the whole
# product. See docs/PRODUCT_DECISION_LOG.md.
dependencies = [
  "Pillow>=11,<14",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ipw*"]
namespaces = true

[tool.setuptools.package-data]
"ipw.vector" = ["py.typed"]
