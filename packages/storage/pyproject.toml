[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipw-storage"
version = "0.1.0"
description = "Production storage boundary contracts and protocols."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "ipw-contracts==0.1.0",
  "google-cloud-storage==3.13.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ipw*"]
namespaces = true

[tool.setuptools.package-data]
"ipw.storage" = ["py.typed"]
