[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipw-processing-worker"
version = "0.1.0"
description = "Production processing worker boundary for Product V2."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "ipw-contracts==0.1.0",
  "ipw-jobs==0.1.0",
  "ipw-storage==0.1.0",
  "ipw-inspection==0.1.0",
  "ipw-licence-registry==0.1.0",
  "google-auth==2.57.0",
  "pg8000==1.31.5",
]

[project.scripts]
ipw-processing-worker = "ipw.processing_worker.task_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ipw*"]
namespaces = true

[tool.setuptools.package-data]
"ipw.processing_worker" = ["py.typed"]
