[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipw-benchmark-runner"
version = "0.1.0"
description = "Benchmark validation, identifiers, reporting and orchestration."
requires-python = ">=3.11"
license = "MIT"

dependencies = [
  "ipw-contracts==0.1.0",
  "ipw-processors==0.1.0",
]

[project.scripts]
bench = "ipw.benchmark_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ipw*"]
namespaces = true

[tool.setuptools.package-data]
"ipw.benchmark_runner" = ["py.typed"]
