[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipw-workspace-api"
version = "0.1.0"
description = "Local application service for the Image & PDF Workspace."
requires-python = ">=3.11"
license = "MIT"

# Deliberately no third-party dependency. The HTTP layer is http.server from the
# standard library; a web framework would be more comfortable and would also be a
# permanent licence-register entry (Gate A) for six routes.
dependencies = [
  "ipw-contracts==0.1.0",
  "ipw-processors==0.1.0",
  "ipw-benchmark-runner==0.1.0",
  "ipw-pdf==0.1.0",
  "ipw-vector==0.1.0",
  # RSA-SHA256, for signing Google Cloud Storage V4 URLs. Chosen over
  # google-cloud-storage, which would have brought seventeen packages to do the
  # same job - see ipw.workspace_api.storage for the reasoning.
  "cryptography>=44,<52",
  # PostgreSQL, in pure Python. Chosen over psycopg/psycopg2, which are
  # LGPL-3.0 and would put a copyleft component in the runtime path of every
  # request. It costs four permissive transitive packages; that trade is
  # recorded in the licence register rather than left to be rediscovered.
  "pg8000>=1.31,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ipw*"]
namespaces = true

[tool.setuptools.package-data]
# The .sql files must ship inside the wheel. They are read relative to the
# module, so if they are not packaged the container starts and then fails to
# migrate - which is a worse failure than not starting.
"ipw.workspace_api" = ["py.typed", "migrations/*.sql"]
